  <g stroke="#37B6FF" stroke-opacity="0.5" stroke-width="2">
    <path d="M970 462 V452 M984 462 V452 M998 462 V452 M970 526 V536 M984 526 V536 M998 526 V536 M958 474 H948 M958 489 H948 M958 504 H948 M1012 474 H1022 M1012 489 H1022 M1012 504 H1022"/>
